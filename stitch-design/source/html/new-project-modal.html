<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DevDocs AI - New Project</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Lora:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#c9c6c4",
                        "surface-container": "#f1edec",
                        "secondary-container": "#fe9572",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#ebe7e6",
                        "on-error-container": "#93000a",
                        "surface": "#fdf8f7",
                        "secondary": "#99462a",
                        "primary": "#000000",
                        "on-secondary-container": "#762c12",
                        "secondary-fixed-dim": "#ffb59e",
                        "surface-container-low": "#f7f3f2",
                        "snow-white": "#ffffff",
                        "secondary-fixed": "#ffdbd0",
                        "surface-container-highest": "#e5e2e1",
                        "dusty-gray": "#73726c",
                        "outline": "#767872",
                        "tertiary-container": "#1c1b1b",
                        "terra-cotta": "#d97757",
                        "on-tertiary-fixed": "#1c1b1b",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c7c7c0",
                        "on-surface-variant": "#464742",
                        "on-tertiary-fixed-variant": "#484646",
                        "tertiary": "#000000",
                        "on-error": "#ffffff",
                        "surface-bright": "#fdf8f7",
                        "surface-tint": "#5f5e5d",
                        "primary-container": "#1c1c1a",
                        "on-primary-fixed-variant": "#474745",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#e6e1e1",
                        "primary-fixed": "#e5e2e0",
                        "on-primary-fixed": "#1c1c1a",
                        "on-background": "#1c1b1b",
                        "vellum-white": "#faf9f5",
                        "onyx": "#1f1e1d",
                        "inverse-surface": "#313030",
                        "error-container": "#ffdad6",
                        "surface-dim": "#ddd9d8",
                        "surface-variant": "#e5e2e1",
                        "on-surface": "#1c1b1b",
                        "background": "#fdf8f7",
                        "on-tertiary-container": "#868383",
                        "inverse-primary": "#c9c6c4",
                        "parchment": "#dedcd1",
                        "graphite": "#3d3d3a",
                        "on-primary-container": "#858382",
                        "on-secondary-fixed": "#390b00",
                        "inverse-on-surface": "#f4f0ef",
                        "stone": "#9c9a92",
                        "tertiary-fixed-dim": "#cac5c5",
                        "ink-black": "#141413",
                        "pale-azure": "#ccdbe8",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#7a2f15"
                    },
                    "borderRadius": {
                        "DEFAULT": "9.6px",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gap-xs": "8px",
                        "container-max": "1200px",
                        "gap-md": "24px",
                        "gap-lg": "32px",
                        "unit": "8px",
                        "section-xl": "40px"
                    },
                    "fontFamily": {
                        "h2": ["Lora"],
                        "body-lg": ["Inter"],
                        "caption": ["Inter"],
                        "label-caps": ["Inter"],
                        "display": ["Lora"],
                        "h4": ["Lora"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "h3": ["Lora"]
                    },
                    "fontSize": {
                        "h2": ["30px", { "lineHeight": "1.33", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "1.33", "fontWeight": "400" }],
                        "label-caps": ["11px", { "lineHeight": "1.33", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display": ["56px", { "lineHeight": "1.2", "fontWeight": "330" }],
                        "h4": ["18px", { "lineHeight": "1.33", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-md": ["15px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "h3": ["24px", { "lineHeight": "1.33", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center font-body-lg text-body-lg text-on-background relative">
<!-- Backdrop Blur -->
<div class="fixed inset-0 bg-surface/30 backdrop-blur-[4px] z-40"></div>
<!-- Modal Container -->
<div class="relative z-50 w-full max-w-[600px] bg-vellum-white border border-parchment rounded p-gap-md mx-4 shadow-none">
<!-- Header -->
<div class="mb-gap-md">
<h3 class="font-h3 text-h3 text-ink-black mb-1">Create New Project</h3>
<p class="font-body-sm text-body-sm text-dusty-gray">Initialize a new scholarly documentation workspace for your repository.</p>
</div>
<!-- Input Section -->
<div class="mb-gap-md flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-dusty-gray uppercase" for="projectName">PROJECT NAME</label>
<input class="w-full bg-snow-white border border-[rgba(31,30,29,0.15)] rounded px-3 py-2 font-body-sm text-body-sm text-ink-black placeholder:text-stone focus:outline-none focus:ring-1 focus:ring-ink-black focus:border-ink-black shadow-none transition-colors" id="projectName" placeholder="e.g., Quantum Analysis Engine" type="text"/>
</div>
<!-- Project Type Section -->
<div class="mb-gap-md flex flex-col gap-2">
<span class="font-label-caps text-label-caps text-dusty-gray uppercase">PROJECT TYPE</span>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
<!-- Option 1 -->
<button class="flex flex-col items-start p-4 bg-vellum-white border border-parchment rounded hover:border-graphite transition-colors text-left group" type="button">
<span class="material-symbols-outlined text-ink-black mb-2" data-icon="web">web</span>
<span class="font-body-sm text-body-sm text-ink-black font-medium">SaaS Application</span>
</button>
<!-- Option 2 -->
<button class="flex flex-col items-start p-4 bg-vellum-white border border-parchment rounded hover:border-graphite transition-colors text-left group" type="button">
<span class="material-symbols-outlined text-ink-black mb-2" data-icon="api">api</span>
<span class="font-body-sm text-body-sm text-ink-black font-medium">API Service</span>
</button>
<!-- Option 3 -->
<button class="flex flex-col items-start p-4 bg-vellum-white border border-parchment rounded hover:border-graphite transition-colors text-left group" type="button">
<span class="material-symbols-outlined text-ink-black mb-2" data-icon="build">build</span>
<span class="font-body-sm text-body-sm text-ink-black font-medium">Internal Tool</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="flex justify-end items-center gap-3 mt-gap-md pt-gap-xs">
<button class="px-4 py-2 bg-transparent text-ink-black font-body-sm text-body-sm rounded hover:bg-surface-container-low transition-colors border border-transparent" type="button">
                Cancel
            </button>
<button class="px-6 py-2 bg-ink-black text-snow-white font-body-sm text-body-sm font-medium rounded hover:bg-graphite transition-colors shadow-none" type="button">
                Create Project
            </button>
</div>
</div>
</body></html>
