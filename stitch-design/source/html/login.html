<style>.custom-input { border-radius: 9.6px; }
.custom-radius { border-radius: 9.6px; }</style>

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Top Navigation suppressed for Transactional Page -->
<main class="w-full max-w-[448px] mx-auto">
<!-- Header / Logo -->
<div class="text-center mb-8">
<h1 class="font-display text-h3 font-normal text-ink-black mb-2">DevDocs AI</h1>
<p class="font-body-md text-body-md text-stone">Scholarly Rigor for Modern Code.</p>
</div>
<!-- Login Card -->
<div class="bg-vellum-white border border-parchment p-8 rounded-lg shadow-sm">
<h2 class="font-h2 text-h2 text-ink-black mb-8 text-center">Sign in to your account</h2>
<form class="space-y-6">
<!-- Email Input -->
<div>
<label class="block font-label-caps text-label-caps text-ink-black mb-2 uppercase" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone text-xl">mail</span>
<input class="w-full bg-snow-white border text-ink-black font-body-md text-body-md pl-10 pr-3 py-3 custom-input focus:outline-none focus:border-outline focus:ring-1 focus:ring-outline placeholder-stone transition-colors border-[#dedcd1]" id="email" name="email" placeholder="scholar@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block font-label-caps text-label-caps text-ink-black uppercase" for="password">Password</label>
<a class="font-caption text-caption text-stone hover:text-terra-cotta transition-colors underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-stone text-xl">lock</span>
<input class="w-full bg-snow-white border text-ink-black font-body-md text-body-md pl-10 pr-3 py-3 custom-input focus:outline-none focus:border-outline focus:ring-1 focus:ring-outline placeholder-stone transition-colors border-[#dedcd1]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-ink-black text-snow-white font-body-lg text-body-lg py-4 hover:bg-onyx transition-colors duration-200 font-medium custom-radius" type="submit">
                    Sign in
                </button>
</form>
<!-- Divider -->
<div class="mt-8 mb-6 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-parchment"></div>
</div>
<div class="relative flex justify-center text-sm font-medium leading-6">
<span class="bg-vellum-white px-4 font-caption text-caption text-stone uppercase tracking-wider">Or continue with</span>
</div>
</div>
<!-- OAuth Options -->
<div class="space-y-4">
<button class="w-full flex items-center justify-center gap-3 bg-transparent border text-ink-black font-body-md text-body-md py-3 hover:bg-surface-container-low transition-colors duration-200 border-[#dedcd1] custom-radius font-normal" type="button">
<svg aria-hidden="true" class="h-5 w-5" viewbox="0 0 24 24">
<path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z" fill="#EA4335"></path>
<path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4"></path>
<path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05"></path>
<path d="M12.0004 24.0001C15.2404 24.0001 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.26538 14.29L1.27539 17.385C3.25539 21.31 7.3104 24.0001 12.0004 24.0001Z" fill="#34A853"></path>
</svg>
                    Google
                </button>
<button class="w-full flex items-center justify-center gap-3 bg-transparent border text-ink-black font-body-md text-body-md py-3 hover:bg-surface-container-low transition-colors duration-200 border-[#dedcd1] custom-radius font-normal" type="button">
<svg aria-hidden="true" class="h-5 w-5 text-ink-black" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
</svg>
                    GitHub
                </button>
</div>
</div>
<!-- Footer Link -->
<p class="mt-8 text-center font-body-sm text-body-sm text-stone">
            Don't have an account? 
            <a class="font-body-sm text-body-sm text-ink-black hover:text-terra-cotta transition-colors underline" href="#">Sign up for an invitation</a>.
        </p>
</main>

</body></html>
